name: Organize Atlas asset library

on:
  push:
    branches: [assets/gongbi-candidates]

permissions:
  contents: write

jobs:
  organize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets/gongbi-candidates
          fetch-depth: 0

      - name: Arrange Atlas files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob

          ROOT="public/images/atlas"
          PKG="$ROOT/airix-atlas-production-package-v1"
          EXTRA="$ROOT/airix-atlas-groups-4-6-7-8-9"

          mkdir -p \
            "$ROOT/scenes/masters" \
            "$ROOT/scenes/responsive" \
            "$ROOT/scenes/layers" \
            "$ROOT/scenes/candidates/gongbi" \
            "$ROOT/scenes/candidates/legacy" \
            "$ROOT/scenes/candidates/raw-generated" \
            "$ROOT/objects/png" \
            "$ROOT/objects/svg" \
            "$ROOT/people" \
            "$ROOT/clothing" \
            "$ROOT/transport" \
            "$ROOT/vegetation" \
            "$ROOT/landmarks" \
            "$ROOT/street-details" \
            "$ROOT/markers/district" \
            "$ROOT/icons/svg" \
            "$ROOT/wayfinding/arrows" \
            "$ROOT/wayfinding/labels" \
            "$ROOT/wayfinding/legends" \
            "$ROOT/wayfinding/nodes" \
            "$ROOT/wayfinding/route-lines" \
            "$ROOT/wayfinding/templates" \
            "$ROOT/graphics/stamps" \
            "$ROOT/graphics/labels" \
            "$ROOT/graphics/signs" \
            "$ROOT/graphics/lettering" \
            "$ROOT/textures/paper" \
            "$ROOT/textures/print" \
            "$ROOT/textures/weather" \
            "$ROOT/textures/environment" \
            "$ROOT/textures/shadows" \
            "$ROOT/docs" \
            "$ROOT/manifests" \
            "$ROOT/misc"

          move_contents() {
            local src="$1"
            local dst="$2"
            if [ -d "$src" ]; then
              mkdir -p "$dst"
              find "$src" -mindepth 1 -maxdepth 1 ! -name '.DS_Store' -exec mv -f {} "$dst"/ \;
            fi
          }

          # Groups 1–3 and 5 from the consolidated production package.
          move_contents "$PKG/01-master-scenes" "$ROOT/scenes/masters"
          move_contents "$PKG/02-responsive-crops" "$ROOT/scenes/responsive"
          move_contents "$PKG/03-transparent-scene-layers" "$ROOT/scenes/layers"
          move_contents "$PKG/05-people-clothing-vehicles-environment/people" "$ROOT/people"
          move_contents "$PKG/05-people-clothing-vehicles-environment/clothing" "$ROOT/clothing"
          move_contents "$PKG/05-people-clothing-vehicles-environment/transport" "$ROOT/transport"
          move_contents "$PKG/05-people-clothing-vehicles-environment/vegetation" "$ROOT/vegetation"
          move_contents "$PKG/05-people-clothing-vehicles-environment/landmarks" "$ROOT/landmarks"
          move_contents "$PKG/05-people-clothing-vehicles-environment/street-details" "$ROOT/street-details"

          [ -f "$PKG/02-responsive-crops/manifest.json" ] && mv -f "$PKG/02-responsive-crops/manifest.json" "$ROOT/manifests/responsive-crops.json" || true
          [ -f "$PKG/03-transparent-scene-layers/manifest.json" ] && mv -f "$PKG/03-transparent-scene-layers/manifest.json" "$ROOT/manifests/scene-layers.json" || true
          [ -f "$PKG/05-people-clothing-vehicles-environment/manifest.json" ] && mv -f "$PKG/05-people-clothing-vehicles-environment/manifest.json" "$ROOT/manifests/people-environment.json" || true

          # Groups 4, 6, 7, 8 and 9.
          move_contents "$EXTRA/04-reusable-objects-and-artifacts/png" "$ROOT/objects/png"
          move_contents "$EXTRA/04-reusable-objects-and-artifacts/svg" "$ROOT/objects/svg"
          [ -f "$EXTRA/04-reusable-objects-and-artifacts/manifest.json" ] && mv -f "$EXTRA/04-reusable-objects-and-artifacts/manifest.json" "$ROOT/manifests/objects.json" || true

          move_contents "$EXTRA/06-district-markers-and-svg-icons/district-markers" "$ROOT/markers/district"
          move_contents "$EXTRA/06-district-markers-and-svg-icons/icons" "$ROOT/icons/svg"

          move_contents "$EXTRA/07-route-map-and-wayfinding-kit/arrows" "$ROOT/wayfinding/arrows"
          move_contents "$EXTRA/07-route-map-and-wayfinding-kit/labels" "$ROOT/wayfinding/labels"
          move_contents "$EXTRA/07-route-map-and-wayfinding-kit/legends" "$ROOT/wayfinding/legends"
          move_contents "$EXTRA/07-route-map-and-wayfinding-kit/nodes" "$ROOT/wayfinding/nodes"
          move_contents "$EXTRA/07-route-map-and-wayfinding-kit/route-lines" "$ROOT/wayfinding/route-lines"
          move_contents "$EXTRA/07-route-map-and-wayfinding-kit/templates" "$ROOT/wayfinding/templates"

          move_contents "$EXTRA/08-stamp-label-signage-lettering/stamps" "$ROOT/graphics/stamps"
          move_contents "$EXTRA/08-stamp-label-signage-lettering/labels" "$ROOT/graphics/labels"
          move_contents "$EXTRA/08-stamp-label-signage-lettering/signs" "$ROOT/graphics/signs"
          move_contents "$EXTRA/08-stamp-label-signage-lettering/lettering" "$ROOT/graphics/lettering"

          move_contents "$EXTRA/09-texture-and-atmosphere-library/paper" "$ROOT/textures/paper"
          move_contents "$EXTRA/09-texture-and-atmosphere-library/print" "$ROOT/textures/print"
          move_contents "$EXTRA/09-texture-and-atmosphere-library/weather" "$ROOT/textures/weather"
          move_contents "$EXTRA/09-texture-and-atmosphere-library/environment" "$ROOT/textures/environment"
          move_contents "$EXTRA/09-texture-and-atmosphere-library/shadows" "$ROOT/textures/shadows"

          # Candidate studies.
          move_contents "$ROOT/atlas-images-preview/gongbi" "$ROOT/scenes/candidates/gongbi"
          move_contents "$ROOT/atlas-images-preview/legacy" "$ROOT/scenes/candidates/legacy"

          # Preserve loose generated PNGs as review-only raw candidates with clean names.
          n=1
          while IFS= read -r -d '' file; do
            printf -v target '%s/scenes/candidates/raw-generated/raw-candidate-%03d.png' "$ROOT" "$n"
            mv -f "$file" "$target"
            n=$((n+1))
          done < <(find "$ROOT" -maxdepth 1 -type f \( -name 'ChatGPT Image *.png' -o -name 'Image_*.png' \) -print0 | sort -z)

          [ -f "$ROOT/favicon.png" ] && mv -f "$ROOT/favicon.png" "$ROOT/misc/favicon.png" || true

          # Remove duplicate package wrappers, staging material and Finder metadata.
          rm -rf \
            "$PKG" \
            "$EXTRA" \
            "$ROOT/atlas-images-preview" \
            "$ROOT/atlas_responsive_crops_group2" \
            "$ROOT/atlas_transparent_layers_group3" \
            "$ROOT/candidates" \
            .asset-staging
          find "$ROOT" -name '.DS_Store' -delete

          # Consolidated documentation.
          cat > "$ROOT/README.md" <<'EOF'
          # Airix Atlas Asset Library

          Production assets for the Airix Atlas visual system.

          ## Structure

          - `scenes/masters` — approved master scene candidates
          - `scenes/responsive` — desktop, tablet, mobile, social and thumbnail crops
          - `scenes/layers` — transparent depth layers for motion and compositing
          - `scenes/candidates` — Gongbi, legacy and raw review candidates
          - `objects` — 25 reusable Atlas objects in PNG and SVG
          - `people`, `clothing`, `transport`, `vegetation`, `landmarks`, `street-details` — isolated production assets
          - `markers` and `icons` — district and interface SVG systems
          - `wayfinding` — route lines, nodes, arrows, labels, legends and templates
          - `graphics` — stamps, labels, signs and lettering
          - `textures` — paper, print, weather, environmental and shadow overlays
          - `manifests` — machine-readable inventories
          - `docs` — palette and usage guidance

          ## Visual direction

          Gongbi-inspired technique + Lagos subject matter + Atlas palette.

          Generated wording, public signage, logos and landmark details must be reviewed before publication.
          EOF

          cat > "$ROOT/docs/USAGE.md" <<'EOF'
          # Atlas Asset Usage

          Use SVG assets for scalable interface, object and wayfinding placements. Preserve transparent PNG masters. Use WebP responsive crops for website delivery. Texture overlays are intended for Multiply, Screen, Overlay or Soft Light blend modes. Route graphics are illustrative and are not authoritative navigation data.
          EOF

          cat > "$ROOT/docs/PALETTE.md" <<'EOF'
          # Atlas Palette

          - Paper: `#F3E6C8`
          - Cream: `#FBF4E4`
          - Ink: `#2E2A24`
          - Navy: `#22384A`
          - Orange: `#D86E1F`
          - Gold: `#D8A23A`
          - Yellow: `#E7B83E`
          - Lagoon: `#6E9E9B`
          - Green: `#667B55`
          - Rust: `#9A4D2A`
          - Muted: `#B9A98C`
          EOF

          # Remove this one-time organizer after it completes.
          rm -f .github/workflows/unpack-atlas-assets.yml

      - name: Commit organized asset library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assets: organize Atlas production library"
          git push origin HEAD:assets/gongbi-candidates
